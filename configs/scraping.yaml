  # Storage
  output_format: "jsonl"         # jsonl | csv
  snapshot_dir: "data/raw_snapshots"

# Labeling — 7-day re-check
labeling:
  check_after_days: 7
  sold_indicators:
    - "Satıldı"
  removed_http_codes: [404, 410]
  output_dir: "data/labels"
